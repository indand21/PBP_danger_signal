[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbp-danger-signal"
version = "1.1.0"
description = "Within-host QSP model of the danger-signal cost of antibiotic killing, with PBP-specific release yields"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Anand Srinivasan"},
    {name = "Abhishek Anil"},
    {name = "Archana AS"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "SALib>=1.4.8,<1.5",
    # src/utils/provenance.py reads SciPy's declared NumPy range through it.
    "packaging>=23.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.2"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["pbp-danger-signal[ml,dev]"]

[project.scripts]
qsp = "cli:main"

[tool.setuptools]
# cli.py is a top-level module, not a package, so the discovery below does
# not find it. Without this the installed `qsp` entry point fails with
# ImportError.
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]

[tool.setuptools.package-dir]
src = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
